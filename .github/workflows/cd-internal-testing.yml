# Reusable release workflow shared across aaatechnology Android app repos: for each
# selected product flavour, builds a signed release App Bundle + APK, uploads the AAB to
# that flavour's own Play Store package on Internal Testing, uploads the release APK to
# its Firebase app, and - only once every flavour's Play Store upload is confirmed - creates
# the git tag + draft GitHub release that records the shipped version (one version for all
# flavours). See this repo's README for the calling pattern.
#
# Flavours: `flavors` is "all" (every flavour the app has) or a comma/space-separated list.
# Package names, Firebase app IDs, task names and output paths come from the
# com.aaatech.build-tools plugin's printAppInfo task (>= 0.14.0); an app without flavours
# has exactly one, named "default". A re-run skips any flavour whose versionCode is
# already on Internal Testing, so a release that failed for one flavour can be finished.
#
# Versioning is git-native: the next version comes from the latest "X.Y.Z" tag plus
# the release PR's declared "## Version Bump" (major/minor/patch, or "same" to
# re-release the latest version while its GitHub release is still a draft), and versionCode is
# the total commit count on this branch (deterministic from any commit, so it's
# exactly reproducible later from a tag alone - see promote-to-production). There is
# no version file to keep in sync across branches: any branch can always ask "what's
# the latest tag" and compute forward from there.

name: Android Release to Play Store (reusable)

on:
  workflow_call:
    inputs:
      app_display_name:
        description: 'Display name used in Firebase release notes (e.g. "Age Calculator")'
        required: true
        type: string
      firebase_testers_group:
        description: 'Firebase App Distribution tester group to distribute release builds to'
        required: false
        type: string
        default: 'android-testers'
      play_internal_testing_link:
        description: 'Link to the Play Store Internal Testing opt-in page, posted in the PR comment on success'
        required: false
        type: string
        default: ''
      java_version:
        description: 'JDK version to build with'
        required: false
        type: string
        default: '17'
      flavors:
        description: 'Flavours to release: "all" (every flavour; "default" for an app without flavours) or a comma/space-separated list like "free,pro"'
        required: false
        type: string
        default: 'all'
      back_merge_branch:
        description: 'Branch to merge the released commit back into after a successful release (keeps its latest tag and versionCode ahead of main). Empty disables it; skipped if the branch does not exist.'
        required: false
        type: string
        default: 'develop'
    secrets:
      android_keystore_base64:
        required: true
      android_keystore_password:
        required: true
      android_key_alias:
        required: true
      android_key_password:
        required: true
      play_service_account_json:
        required: true
      # Only a fallback for an app with one flavour and no google-services.json: each
      # flavour's Firebase app ID normally comes from google-services.json (printAppInfo).
      firebase_app_id:
        required: false
      credential_file_content:
        required: true
      gh_packages_read_token:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every ./gradlew invocation below needs this: app/build.gradle.kts applies the
    # com.aaatech.build-tools plugin from aaatechnology/build-tools's GitHub Packages
    # registry, which requires auth to resolve even though the repo is public.
    env:
      # Must match gh_packages_read_token's actual owning account (aaatechnology),
      # not github.actor (whoever triggered this run) - GitHub Packages validates
      # the pair together.
      GITHUB_ACTOR: aaatechnology
      GH_PACKAGES_READ_TOKEN: ${{ secrets.gh_packages_read_token }}
      # Per-flavour results (Play / Firebase status), one folder each.
      FLAVOR_RESULTS: ${{ github.workspace }}/../flavor-results
      # Release assets for the GitHub release: each flavour's AAB and mapping file.
      RELEASE_ASSETS: ${{ github.workspace }}/../release-assets
      # fastlane's output is parsed below (track version codes); no colour codes in it.
      FASTLANE_DISABLE_COLORS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: computing the next version needs every "X.Y.Z" tag
          # reachable, and versionCode (total commit count) needs full commit depth -
          # a shallow default checkout would silently give wrong answers for both.
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Reconstructs the ../key/keystore.properties + keystore file that
      # app/build.gradle.kts's release signingConfig expects, from secrets.
      - name: Reconstruct release keystore
        run: |
          KEY_DIR="$(mkdir -p "${{ github.workspace }}/../key" && cd "${{ github.workspace }}/../key" && pwd)"
          echo "${{ secrets.android_keystore_base64 }}" | base64 -d > "$KEY_DIR/release.jks"
          cat > "$KEY_DIR/keystore.properties" <<EOF
          storeFile=$KEY_DIR/release.jks
          storePassword=${{ secrets.android_keystore_password }}
          keyAlias=${{ secrets.android_key_alias }}
          keyPassword=${{ secrets.android_key_password }}
          EOF

      # Asks Gradle for each selected flavour's package, Firebase app ID, task names and
      # output paths, as KEY=value lines (APP_FLAVORS, FREE_APPLICATION_ID, ...) added to the
      # environment. Fails here, before building, on an unknown flavour. Gradle's JVM also
      # prints WARNING lines, hence the filter.
      - name: Read the app's flavours from Gradle
        shell: bash
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: |
          ./gradlew -q printAppInfo "-PappFlavors=$FLAVORS" > "$RUNNER_TEMP/app-info.txt"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/app-info.txt" | tee -a "$GITHUB_ENV"

      # Each flavour's debug unit tests (a flavoured app has no testDebugUnitTest, only
      # test<Flavor>DebugUnitTest), in one Gradle invocation.
      - name: Run gradle tests
        shell: bash
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }
          TASKS=()
          for FLAVOR in $APP_FLAVORS; do TASKS+=("$(var "$FLAVOR" DEBUG_TEST_TASK)"); done
          ./gradlew "${TASKS[@]}"

      # Looks up the PR associated with this commit (main only ever moves via merged
      # PRs) and pulls its "## Release Notes" and "## Version Bump" sections. Falls
      # back to the commit subject / patch for release notes / bump type if no PR is
      # found (workflow_dispatch, or a direct push) or a section was left empty.
      - name: Extract release notes and version bump from the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0]' 2>/dev/null || echo "")
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || echo "")
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty' 2>/dev/null || echo "")

          NOTES=""
          NOTES_FROM_PR=false
          if [ -n "$PR_BODY" ]; then
            NOTES=$(printf '%s\n' "$PR_BODY" \
              | awk '/^## Release Notes/{flag=1; next} /^## /{flag=0} flag' \
              | sed '/<!--/,/-->/d' \
              | sed '/./,$!d')
          fi

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]-')" ]; then
            NOTES=$(git log -1 --pretty=%s)
          else
            NOTES_FROM_PR=true
          fi

          VERSION_BUMP=""
          if [ -n "$PR_BODY" ]; then
            VERSION_BUMP=$(printf '%s\n' "$PR_BODY" \
              | awk '/^## Version Bump/{flag=1; next} /^## /{flag=0} flag' \
              | sed '/<!--/,/-->/d' \
              | tr -d '[:space:]')
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$NOTES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "VERSION_BUMP=$VERSION_BUMP" >> "$GITHUB_ENV"
          echo "NOTES_FROM_PR=$NOTES_FROM_PR" >> "$GITHUB_ENV"
          echo "Version bump requested: ${VERSION_BUMP:-patch (default)}"

      # Computed BEFORE building (not read back from the build afterward): the build
      # step needs the exact target version to embed in the AAB/APK, and this decides
      # it from the latest reachable "X.Y.Z" tag (no "v" prefix) plus VERSION_BUMP
      # (major/minor/patch, from the step above) - no tag is created yet, that only
      # happens after a confirmed successful Play Store upload, further down.
      - name: Compute next version from git tags
        run: |
          LATEST_TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")

          RERELEASE=false
          if [ "$VERSION_BUMP" = "same" ]; then
            # Re-release of the latest version (e.g. a crash fix before it ever reached
            # production): keep its versionName; versionCode still comes from the commit
            # count below, so Play accepts the new upload. Guarded in the next step: only
            # allowed while that version's GitHub release is still a draft.
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::Version Bump 'same' needs an existing release tag to re-release."
              exit 1
            fi
            RELEASE_VERSION_NAME="$LATEST_TAG"
            RERELEASE=true
          elif [ -z "$LATEST_TAG" ]; then
            # No release has ever been tagged - this is the very first one, so it's
            # 1.0.0 regardless of the declared bump type (there's nothing to bump
            # "from" yet).
            RELEASE_VERSION_NAME="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

            case "$VERSION_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac

            RELEASE_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RERELEASE=$RERELEASE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # "same" re-release: refuse if the version's GitHub release was already published
      # (it may be in production - ship a patch instead), then aggregate release notes:
      # the draft's existing notes followed by this PR's new ones, duplicate lines
      # dropped. The tag and draft release are moved/updated after the upload below.
      - name: Prepare re-release of a draft version
        if: env.RERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $RELEASE_TAG is not a draft (published or missing) - use a patch bump instead of 'same'."
            exit 1
          fi

          PREVIOUS_NOTES=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq '.body')
          if [ "$NOTES_FROM_PR" = "true" ]; then
            COMBINED=$(printf '%s\n%s\n' "$PREVIOUS_NOTES" "$RELEASE_NOTES")
          else
            # No new notes in the PR (the fallback is just the merge commit subject).
            COMBINED="$PREVIOUS_NOTES"
          fi
          COMBINED=$(printf '%s\n' "$COMBINED" | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++')

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$COMBINED" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "Re-releasing $RELEASE_TAG with aggregated notes:"
          echo "$COMBINED"

      # Builds both the AAB (for Play Store) and a signed release APK (for Firebase
      # App Distribution) in one invocation - same signing config, same version stamp.
      # The explicit -P flags are what make app/build.gradle.kts embed the version
      # computed above, instead of deriving one itself from git (which it only does
      # for non-release builds - see that file for the full mechanism).
      - name: Build release App Bundles and APKs
        # Every selected flavour ("free" -> bundleFreeRelease, assembleFreeRelease), all with
        # the same version. Each flavour's AAB and mapping are then collected for the
        # GitHub release (the mapping renamed per flavour, as they're all "mapping.txt").
        shell: bash
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }
          TASKS=()
          for FLAVOR in $APP_FLAVORS; do
            TASKS+=("$(var "$FLAVOR" RELEASE_BUNDLE_TASK)" "$(var "$FLAVOR" RELEASE_ASSEMBLE_TASK)")
          done
          ./gradlew "${TASKS[@]}" \
            "-PreleaseVersionName=$RELEASE_VERSION_NAME" "-PreleaseVersionCode=$VERSION_CODE"

          mkdir -p "$RELEASE_ASSETS"
          for FLAVOR in $APP_FLAVORS; do
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            mkdir -p "$OUT"
            AAB=$(find "$(var "$FLAVOR" RELEASE_BUNDLE_DIR)" -name "*.aab" | head -1)
            APK=$(find "$(var "$FLAVOR" RELEASE_APK_DIR)" -name "*.apk" | head -1)
            echo "$AAB" > "$OUT/aab"
            echo "$APK" > "$OUT/apk"
            cp "$AAB" "$RELEASE_ASSETS/"
            MAPPING="$(var "$FLAVOR" RELEASE_MAPPING)"
            if [ -f "$MAPPING" ]; then
              if [ "$FLAVOR" = "default" ]; then cp "$MAPPING" "$RELEASE_ASSETS/mapping.txt"
              else cp "$MAPPING" "$RELEASE_ASSETS/mapping-$FLAVOR.txt"; fi
            fi
            echo "$FLAVOR: $AAB, $APK"
          done

      # Uploads via fastlane's upload_to_play_store, not r0adkll/upload-google-play -
      # that action's upload succeeds but then fails at "Committing the Edit" with a
      # nonsensical "Target SDK of artifact is too low: <our versionCode>" error (a bug
      # in how it surfaces the real Play API response), so the edit never actually
      # commits and nothing reaches the track. fastlane is what promote-to-production.yml
      # (and IFSC's equivalent workflows) already use successfully for the same API.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Write Play service account key
        env:
          PLAY_JSON: ${{ secrets.play_service_account_json }}
        run: printf '%s' "$PLAY_JSON" > play-service-account.json

      # Play Store "what's new" text is capped at 500 characters per locale. fastlane's
      # supply reads it from metadata/android/<locale>/changelogs/<versionCode>.txt.
      - name: Write Play Store release notes file
        run: |
          mkdir -p "metadata/android/en-US/changelogs"
          printf '%s' "$RELEASE_NOTES" | head -c 500 > "metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

      # One upload per flavour, each to its own package. A flavour whose versionCode is
      # already on Internal Testing is skipped (a re-run after another flavour failed: Play
      # rejects a second upload of the same versionCode). Every flavour is tried; the step
      # fails afterwards if any didn't make it, so no tag or release is created for a
      # half-shipped version - re-run to finish it.
      - name: Upload to Play Store (Internal Testing)
        id: play_upload
        shell: bash
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }
          # The version codes on a package's track, one per line (none if it has none yet).
          track_codes() {
            fastlane run google_play_track_version_codes package_name:"$1" json_key:play-service-account.json track:"$2" 2>&1 \
              | sed -n 's/.*Result: \[\(.*\)\].*/\1/p' | tail -1 | tr ',' '\n' | tr -d ' ' | grep -E '^[0-9]+$' || true
          }

          ALL_UPLOADED=true
          for FLAVOR in $APP_FLAVORS; do
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            PACKAGE="$(var "$FLAVOR" APPLICATION_ID)"
            if track_codes "$PACKAGE" internal | grep -qx "$VERSION_CODE"; then
              echo "✅ already on Internal Testing ($PACKAGE)" > "$OUT/play"
              continue
            fi
            MAPPING="$(var "$FLAVOR" RELEASE_MAPPING)"
            MAPPING_ARG=()
            [ -f "$MAPPING" ] && MAPPING_ARG=(mapping:"$MAPPING")
            if fastlane run upload_to_play_store \
                package_name:"$PACKAGE" \
                json_key:play-service-account.json \
                track:internal \
                release_status:completed \
                aab:"$(cat "$OUT/aab")" \
                "${MAPPING_ARG[@]}" \
                metadata_path:metadata/android \
                skip_upload_apk:true \
                skip_upload_images:true \
                skip_upload_screenshots:true; then
              echo "✅ uploaded to Internal Testing ($PACKAGE)" > "$OUT/play"
            else
              echo "❌ upload failed ($PACKAGE) - check the workflow run, then re-run to finish" > "$OUT/play"
              ALL_UPLOADED=false
            fi
          done
          [ "$ALL_UPLOADED" = true ]

      - name: Remove Play service account key
        if: always()
        run: rm -f play-service-account.json

      # Pushes the real git tag ref immediately - independent of the GitHub Release's
      # draft/public state below. gh release create --draft does NOT push a real tag
      # ref until the release is published (which may be long after, or never, if it
      # stays internal-only) - without this step, a later promote-to-production or
      # play-store-testing run has no way to see that this commit already shipped, and
      # falls back to whatever older tag does exist.
      - name: Push git tag for this release
        if: steps.play_upload.outcome == 'success'
        run: |
          if [ "$RERELEASE" = "true" ]; then
            # Move the draft version's tag to this rebuilt commit.
            git tag -f "$RELEASE_TAG" "${{ github.sha }}"
            git push -f origin "refs/tags/$RELEASE_TAG"
          elif git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, skipping."
          else
            git tag "$RELEASE_TAG" "${{ github.sha }}"
            git push origin "$RELEASE_TAG"
          fi

      # Only runs once the upload is confirmed successful - a failed upload leaves no
      # tag and no draft release behind at all, so the next attempt just recomputes
      # this same next version fresh, with nothing to clean up first. Safe to re-run:
      # skips creation if a release for this tag already exists.
      - name: Create draft GitHub release
        id: gh_release
        if: steps.play_upload.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RERELEASE" = "true" ]; then
            # Update the existing draft in place: new target, aggregated notes, new assets.
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" --repo "${{ github.repository }}" --clobber \
              "$RELEASE_ASSETS"/*
          elif gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation."
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes "$RELEASE_NOTES" \
              "$RELEASE_ASSETS"/*
          fi

      # Play Store Internal Testing can take a while to propagate to testers' devices.
      # Firebase App Distribution installs instantly, so testers can get the real signed
      # release build (not the debug one) right away, same tester group as debug builds -
      # each flavour to its own Firebase app (from google-services.json via printAppInfo;
      # the firebase_app_id secret only for a single flavour without that file).
      - name: Upload release APKs to Firebase App Distribution
        id: firebase_release_distribution
        shell: bash
        env:
          CREDENTIALS: ${{ secrets.credential_file_content }}
          FALLBACK_APP_ID: ${{ secrets.firebase_app_id }}
          GROUP: ${{ inputs.firebase_testers_group }}
          DISPLAY_NAME: ${{ inputs.app_display_name }}
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          npm install -g firebase-tools >/dev/null 2>&1
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$CREDENTIALS" > "$GOOGLE_APPLICATION_CREDENTIALS"

          FLAVOR_COUNT=$(wc -w <<< "$APP_FLAVORS")
          FAILED=false
          for FLAVOR in $APP_FLAVORS; do
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            APP_ID="$(var "$FLAVOR" FIREBASE_APP_ID)"
            if [ -z "$APP_ID" ] && [ "$FLAVOR_COUNT" -eq 1 ]; then
              APP_ID="$FALLBACK_APP_ID"
            fi
            if [ -z "$APP_ID" ]; then
              echo "⚠️ not uploaded: no Firebase app for $(var "$FLAVOR" APPLICATION_ID) in google-services.json" > "$OUT/firebase"
              FAILED=true
              continue
            fi

            LABEL="$DISPLAY_NAME"
            [ "$FLAVOR" != "default" ] && LABEL="$DISPLAY_NAME ($FLAVOR)"
            cat > "$OUT/notes.txt" <<NOTES
          🚀 $LABEL $RELEASE_TAG (Release)

          This is the real signed release build - same code going to Play Store
          Internal Testing, available here immediately instead of waiting on Play
          Store propagation.

          📋 Build Details:
          - Version: $RELEASE_TAG, Version Code: $VERSION_CODE

          📝 Release Notes:
          $RELEASE_NOTES
          NOTES

            if firebase appdistribution:distribute "$(cat "$OUT/apk")" --app "$APP_ID" \
                --groups "$GROUP" --release-notes-file "$OUT/notes.txt"; then
              echo "✅ release APK uploaded - installs instantly, no need to wait on Play Store propagation" > "$OUT/firebase"
            else
              echo "❌ upload failed - check the workflow run" > "$OUT/firebase"
              FAILED=true
            fi
          done
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          [ "$FAILED" = false ]

      # main gets a merge commit per release that never flows back to develop on its
      # own, so develop would neither see the new tag (dev builds stay "<old>.x-dev")
      # nor out-count main (dev versionCodes collide with release ones). Merging the
      # released commit back fixes both. Done in a separate worktree so the build
      # outputs above stay untouched; on a conflict or rejected push (e.g. branch
      # protection) it opens a PR instead of failing the release.
      - name: Back-merge into ${{ inputs.back_merge_branch }}
        id: back_merge
        if: always() && steps.play_upload.outcome == 'success' && inputs.back_merge_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.back_merge_branch }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "No $TARGET branch - skipping back-merge."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET"
          WORKTREE="$RUNNER_TEMP/back-merge"
          git worktree add -B "back-merge-$TARGET" "$WORKTREE" "origin/$TARGET"

          if (cd "$WORKTREE" \
              && git merge --no-ff --no-edit -m "Back-merge $RELEASE_TAG from main into $TARGET" "${{ github.sha }}" \
              && git push origin "HEAD:$TARGET"); then
            echo "BACK_MERGE_STATUS=✅ merged into $TARGET" >> "$GITHUB_ENV"
          else
            (cd "$WORKTREE" && git merge --abort 2>/dev/null || true)
            PR_URL=$(gh pr create --repo "${{ github.repository }}" \
              --base "$TARGET" --head "${{ github.ref_name }}" \
              --title "Back-merge $RELEASE_TAG into $TARGET" \
              --body "Automatic back-merge after releasing $RELEASE_TAG failed (merge conflict or rejected push). Merge this so $TARGET has the release tag and a versionCode ahead of the release." \
              2>&1 || true)
            echo "BACK_MERGE_STATUS=⚠️ automatic merge into $TARGET failed - PR: $PR_URL" >> "$GITHUB_ENV"
          fi
          git worktree remove --force "$WORKTREE" || true

      # Reports back on the PR that triggered this release, if one was found.
      - name: Comment release summary on PR
        if: always() && env.PR_NUMBER != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          BODY="$RUNNER_TEMP/release-comment.md"
          {
            echo "## 🚀 Release $RELEASE_TAG"
            echo
            echo "**Version:** $RELEASE_TAG, Version Code: $VERSION_CODE"
            if [ "${{ steps.play_upload.outcome }}" = "success" ]; then
              echo "📦 **GitHub release (draft):** ${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG"
              if [ -n "${{ inputs.play_internal_testing_link }}" ]; then
                echo "🔗 **Test it:** ${{ inputs.play_internal_testing_link }}"
              fi
            else
              echo "⚠️ Not every flavour reached Play Store, so no tag or GitHub release was created - re-run to finish (flavours already uploaded are skipped)."
            fi
            echo
            for FLAVOR in $APP_FLAVORS; do
              OUT="$FLAVOR_RESULTS/$FLAVOR"
              if [ "$FLAVOR" = "default" ]; then echo "### 📱 $(var "$FLAVOR" APPLICATION_ID)"
              else echo "### 📱 $FLAVOR · $(var "$FLAVOR" APPLICATION_ID)"; fi
              echo "- **Play Store:** $(cat "$OUT/play" 2>/dev/null || echo '❌ not uploaded - check the workflow run')"
              echo "- **Firebase:** $(cat "$OUT/firebase" 2>/dev/null || echo '❌ not uploaded - check the workflow run')"
              echo
            done
            if [ -n "$BACK_MERGE_STATUS" ]; then
              echo "🔀 **Back-merge:** $BACK_MERGE_STATUS"
              echo
            fi
            echo "**Release notes used:**"
            echo "$RELEASE_NOTES"
            echo
            echo "---"
            echo "*Generated by the Release to Play Store workflow.*"
          } > "$BODY"
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$BODY"
