# Reusable release workflow shared across aaatechnology Android app repos: builds a
# signed release App Bundle + APK, uploads the AAB to Play Store Internal Testing,
# uploads the release APK to Firebase App Distribution, and - only once that Play
# Store upload is confirmed successful - creates the git tag + draft GitHub release
# that records the shipped version. See this repo's README for the calling pattern.
#
# Versioning is git-native: the next version comes from the latest "X.Y.Z" tag plus
# the release PR's declared "## Version Bump" (major/minor/patch), and versionCode is
# the total commit count on this branch (deterministic from any commit, so it's
# exactly reproducible later from a tag alone - see promote-to-production). There is
# no version file to keep in sync across branches: any branch can always ask "what's
# the latest tag" and compute forward from there.

name: Android Release to Play Store (reusable)

on:
  workflow_call:
    inputs:
      app_display_name:
        description: 'Display name used in Firebase release notes (e.g. "Age Calculator")'
        required: true
        type: string
      package_name:
        description: 'Android application ID to upload to Play Store (e.g. com.arun.agecalculator)'
        required: true
        type: string
      firebase_testers_group:
        description: 'Firebase App Distribution tester group to distribute release builds to'
        required: false
        type: string
        default: 'android-testers'
      play_internal_testing_link:
        description: 'Link to the Play Store Internal Testing opt-in page, posted in the PR comment on success'
        required: false
        type: string
        default: ''
      java_version:
        description: 'JDK version to build with'
        required: false
        type: string
        default: '17'
    secrets:
      android_keystore_base64:
        required: true
      android_keystore_password:
        required: true
      android_key_alias:
        required: true
      android_key_password:
        required: true
      play_service_account_json:
        required: true
      firebase_app_id:
        required: true
      credential_file_content:
        required: true
      gh_packages_read_token:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every ./gradlew invocation below needs this: app/build.gradle.kts applies the
    # aaatech.app-conventions plugin from aaatechnology/build-tools's GitHub Packages
    # registry, which requires auth to resolve even though the repo is public.
    env:
      # Must match gh_packages_read_token's actual owning account (aaatechnology),
      # not github.actor (whoever triggered this run) - GitHub Packages validates
      # the pair together.
      GITHUB_ACTOR: aaatechnology
      GH_PACKAGES_READ_TOKEN: ${{ secrets.gh_packages_read_token }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: computing the next version needs every "X.Y.Z" tag
          # reachable, and versionCode (total commit count) needs full commit depth -
          # a shallow default checkout would silently give wrong answers for both.
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Reconstructs the ../key/keystore.properties + keystore file that
      # app/build.gradle.kts's release signingConfig expects, from secrets.
      - name: Reconstruct release keystore
        run: |
          KEY_DIR="$(mkdir -p "${{ github.workspace }}/../key" && cd "${{ github.workspace }}/../key" && pwd)"
          echo "${{ secrets.android_keystore_base64 }}" | base64 -d > "$KEY_DIR/release.jks"
          cat > "$KEY_DIR/keystore.properties" <<EOF
          storeFile=$KEY_DIR/release.jks
          storePassword=${{ secrets.android_keystore_password }}
          keyAlias=${{ secrets.android_key_alias }}
          keyPassword=${{ secrets.android_key_password }}
          EOF

      - name: Run gradle tests
        run: ./gradlew testDebugUnitTest

      # Looks up the PR associated with this commit (main only ever moves via merged
      # PRs) and pulls its "## Release Notes" and "## Version Bump" sections. Falls
      # back to the commit subject / patch for release notes / bump type if no PR is
      # found (workflow_dispatch, or a direct push) or a section was left empty.
      - name: Extract release notes and version bump from the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0]' 2>/dev/null || echo "")
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || echo "")
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty' 2>/dev/null || echo "")

          NOTES=""
          if [ -n "$PR_BODY" ]; then
            NOTES=$(printf '%s\n' "$PR_BODY" \
              | awk '/^## Release Notes/{flag=1; next} /^## /{flag=0} flag' \
              | sed '/<!--/,/-->/d' \
              | sed '/./,$!d')
          fi

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]-')" ]; then
            NOTES=$(git log -1 --pretty=%s)
          fi

          VERSION_BUMP=""
          if [ -n "$PR_BODY" ]; then
            VERSION_BUMP=$(printf '%s\n' "$PR_BODY" \
              | awk '/^## Version Bump/{flag=1; next} /^## /{flag=0} flag' \
              | sed '/<!--/,/-->/d' \
              | tr -d '[:space:]')
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "VERSION_BUMP=$VERSION_BUMP" >> $GITHUB_ENV
          echo "Version bump requested: ${VERSION_BUMP:-patch (default)}"

      # Computed BEFORE building (not read back from the build afterward): the build
      # step needs the exact target version to embed in the AAB/APK, and this decides
      # it from the latest reachable "X.Y.Z" tag (no "v" prefix) plus VERSION_BUMP
      # (major/minor/patch, from the step above) - no tag is created yet, that only
      # happens after a confirmed successful Play Store upload, further down.
      - name: Compute next version from git tags
        run: |
          LATEST_TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            # No release has ever been tagged - this is the very first one, so it's
            # 1.0.0 regardless of the declared bump type (there's nothing to bump
            # "from" yet).
            RELEASE_VERSION_NAME="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

            case "$VERSION_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac

            RELEASE_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      # Builds both the AAB (for Play Store) and a signed release APK (for Firebase
      # App Distribution) in one invocation - same signing config, same version stamp.
      # The explicit -P flags are what make app/build.gradle.kts embed the version
      # computed above, instead of deriving one itself from git (which it only does
      # for non-release builds - see that file for the full mechanism).
      - name: Build release App Bundle and APK
        run: ./gradlew bundleRelease assembleRelease -PreleaseVersionName=$RELEASE_VERSION_NAME -PreleaseVersionCode=$VERSION_CODE

      # Uploads via fastlane's upload_to_play_store, not r0adkll/upload-google-play -
      # that action's upload succeeds but then fails at "Committing the Edit" with a
      # nonsensical "Target SDK of artifact is too low: <our versionCode>" error (a bug
      # in how it surfaces the real Play API response), so the edit never actually
      # commits and nothing reaches the track. fastlane is what promote-to-production.yml
      # (and IFSC's equivalent workflows) already use successfully for the same API.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Write Play service account key
        env:
          PLAY_JSON: ${{ secrets.play_service_account_json }}
        run: printf '%s' "$PLAY_JSON" > play-service-account.json

      # Play Store "what's new" text is capped at 500 characters per locale. fastlane's
      # supply reads it from metadata/android/<locale>/changelogs/<versionCode>.txt.
      - name: Write Play Store release notes file
        run: |
          mkdir -p "metadata/android/en-US/changelogs"
          printf '%s' "$RELEASE_NOTES" | head -c 500 > "metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

      - name: Upload to Play Store (Internal Testing)
        id: play_upload
        run: |
          fastlane run upload_to_play_store \
            package_name:${{ inputs.package_name }} \
            json_key:play-service-account.json \
            track:internal \
            release_status:completed \
            aab:app/build/outputs/bundle/release/app-release.aab \
            mapping:app/build/outputs/mapping/release/mapping.txt \
            metadata_path:metadata \
            skip_upload_apk:true \
            skip_upload_images:true \
            skip_upload_screenshots:true

      - name: Remove Play service account key
        if: always()
        run: rm -f play-service-account.json

      # Pushes the real git tag ref immediately - independent of the GitHub Release's
      # draft/public state below. gh release create --draft does NOT push a real tag
      # ref until the release is published (which may be long after, or never, if it
      # stays internal-only) - without this step, a later promote-to-production or
      # play-store-testing run has no way to see that this commit already shipped, and
      # falls back to whatever older tag does exist.
      - name: Push git tag for this release
        if: steps.play_upload.outcome == 'success'
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, skipping."
          else
            git tag "$RELEASE_TAG" "${{ github.sha }}"
            git push origin "$RELEASE_TAG"
          fi

      # Only runs once the upload is confirmed successful - a failed upload leaves no
      # tag and no draft release behind at all, so the next attempt just recomputes
      # this same next version fresh, with nothing to clean up first. Safe to re-run:
      # skips creation if a release for this tag already exists.
      - name: Create draft GitHub release
        id: gh_release
        if: steps.play_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation."
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes "$RELEASE_NOTES" \
              app/build/outputs/bundle/release/app-release.aab \
              app/build/outputs/mapping/release/mapping.txt
          fi

      # Play Store Internal Testing can take a while to propagate to testers' devices.
      # Firebase App Distribution installs instantly, so testers can get the real signed
      # release build (not the debug one) right away, same tester group as debug builds.
      - name: Get release APK file name
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "RELEASE_APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "Found release APK: $APK_FILE"

      - name: Upload release APK to Firebase App Distribution
        id: firebase_release_distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.firebase_app_id }}
          serviceCredentialsFileContent: ${{ secrets.credential_file_content }}
          groups: ${{ inputs.firebase_testers_group }}
          file: ${{ env.RELEASE_APK_FILE }}
          releaseNotes: |
            🚀 ${{ inputs.app_display_name }} ${{ env.RELEASE_TAG }} (Release)

            This is the real signed release build - same code going to Play Store
            Internal Testing, available here immediately instead of waiting on Play
            Store propagation.

            📋 **Build Details:**
            - Version: ${{ env.RELEASE_TAG }}, Version Code: ${{ env.VERSION_CODE }}

            📝 **Release Notes:**
            ${{ env.RELEASE_NOTES }}

      # Reports back on the PR that triggered this release, if one was found.
      - name: Comment release summary on PR
        if: always() && env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.play_upload.outcome }}" = "success" ]; then
            PLAY_STATUS="✅ Uploaded to Play Store Internal Testing"
            TESTING_LINK="${{ inputs.play_internal_testing_link != '' && format('🔗 **Test it:** {0}', inputs.play_internal_testing_link) || '' }}"
            RELEASE_LINK="📦 **GitHub release (draft):** ${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          else
            PLAY_STATUS="❌ Play Store upload failed - check the workflow run"
            TESTING_LINK=""
            RELEASE_LINK=""
          fi
          if [ "${{ steps.firebase_release_distribution.outcome }}" = "success" ]; then
            FIREBASE_STATUS="✅ Release build (signed APK) uploaded to Firebase App Distribution - installs instantly, no need to wait on Play Store propagation"
          else
            FIREBASE_STATUS="❌ Firebase App Distribution upload failed - check the workflow run"
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(cat <<COMMENT
          ## 🚀 Release $RELEASE_TAG

          **Version:** $RELEASE_TAG, Version Code: $VERSION_CODE
          $RELEASE_LINK
          $PLAY_STATUS
          $TESTING_LINK
          🔥 **Firebase:** $FIREBASE_STATUS

          **Release notes used:**
          $RELEASE_NOTES

          ---
          *Generated by the Release to Play Store workflow.*
          COMMENT
          )"
