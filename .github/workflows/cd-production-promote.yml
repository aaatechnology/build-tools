# Reusable promotion workflow shared across aaatechnology Android app repos:
# manually promotes the build already sitting on Google Play's Internal Testing
# track straight to Production - no rebuild, no re-upload, just a track move via
# the Play Developer API (through fastlane's `upload_to_play_store` action). See
# this repo's README for the calling pattern.
#
# Flavours: `flavors` is "all" (every flavour the app has) or a comma/space-separated list;
# each flavour's package comes from the com.aaatech.build-tools plugin's printAppInfo task
# (>= 0.14.0), and an app without flavours has one, named "default". A flavour is only
# promoted when its newest Internal Testing versionCode is higher than Production's - one
# already in Production is reported and left alone.
#
# Release notes doc (optional, `release_notes_doc`): once the release is published, a section
# for the tag goes into that file on `release_notes_branch` (develop by default, committed
# straight to it, so it reaches main with the next release; a push to main would start another
# release), and the GitHub release gets a link to that section. The doc has a table (version,
# date, tag, notes) and one section per version: the release's notes (the release PR's
# `## Release Notes`) and the PRs merged since the previous tag. A version already in the doc
# is left alone, so promoting the same tag again (a staged rollout raised, another flavour)
# adds nothing.

name: Android Promote to Production (reusable)

on:
  workflow_call:
    inputs:
      flavors:
        description: 'Flavours to promote: "all" (every flavour; "default" for an app without flavours) or a comma/space-separated list like "free,pro"'
        required: false
        type: string
        default: 'all'
      java_version:
        description: 'JDK version to run Gradle with (to read the flavours)'
        required: false
        type: string
        default: '17'
      rollout_percentage:
        description: 'Percent of users to roll out to (1-100). Less than 100 starts a staged rollout.'
        required: true
        type: string
      release_notes_doc:
        description: 'Release notes document to add each published release to, e.g. docs/RELEASE_NOTES.md (empty: off)'
        required: false
        type: string
        default: ''
      release_notes_branch:
        description: 'Branch the release notes document is committed to'
        required: false
        type: string
        default: 'develop'
      app_display_name:
        description: 'App name for the release notes document title (empty: "Release notes")'
        required: false
        type: string
        default: ''
    secrets:
      play_service_account_json:
        required: true
      gh_packages_read_token:
        required: true

jobs:
  # Only runs for a "promote-production" comment on a PR - confirms it's an already-
  # merged develop -> main PR before letting the promote job below fire, and tells
  # the commenter why otherwise (wrong branch, not merged yet, or a plain issue).
  # github.event/github.event_name here reflect the ORIGINAL event that triggered the
  # calling workflow (issue_comment or workflow_dispatch) - a called reusable workflow
  # shares the caller's event context, it's not build-tools-specific.
  check_command:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == 'promote-production'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      should_promote: ${{ steps.check.outputs.should_promote }}
    steps:
      - name: Validate this is a merged develop -> main PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json state,baseRefName,headRefName)
          STATE=$(echo "$PR_JSON" | jq -r .state)
          BASE=$(echo "$PR_JSON" | jq -r .baseRefName)
          HEAD=$(echo "$PR_JSON" | jq -r .headRefName)

          if [ "$STATE" = "MERGED" ] && [ "$BASE" = "main" ] && [ "$HEAD" = "develop" ]; then
            echo "should_promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
            gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
              "⚠️ \`promote-production\` only works on a **merged develop → main** PR. This PR: state=$STATE, base=$BASE, head=$HEAD."
          fi

  promote:
    needs: check_command
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check_command.outputs.should_promote == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      summary: ${{ steps.promote.outputs.summary }}
    # ./gradlew (printAppInfo) applies com.aaatech.build-tools from GitHub Packages, which
    # needs auth even though the repo is public.
    env:
      GITHUB_ACTOR: aaatechnology
      GH_PACKAGES_READ_TOKEN: ${{ secrets.gh_packages_read_token }}
      # fastlane's output is parsed below (track version codes); no colour codes in it.
      FASTLANE_DISABLE_COLORS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: resolving "the latest release" (when not run from an
          # explicit tag ref) and computing its versionCode both need full depth.
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Each selected flavour's package (FREE_APPLICATION_ID, ...) from Gradle, added to the
      # environment. Fails here on an unknown flavour.
      - name: Read the app's flavours from Gradle
        shell: bash
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: |
          ./gradlew -q printAppInfo "-PappFlavors=$FLAVORS" > "$RUNNER_TEMP/app-info.txt"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/app-info.txt" | tee -a "$GITHUB_ENV"

      # Only used afterward to un-draft the matching GitHub release - the actual Play
      # Store promotion below never needs this, it promotes whatever's live on the
      # source track directly.
      - name: Determine release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=0)
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Write Play service account key
        env:
          PLAY_JSON: ${{ secrets.play_service_account_json }}
        run: printf '%s' "$PLAY_JSON" > play-service-account.json

      # Per flavour: compares the newest versionCode on Internal Testing with Production's
      # and promotes only when Internal is newer (anything else is already live, or there's
      # nothing to promote). rollout=100 must use status "completed" - the Play API rejects
      # userFraction=1.0 under "inProgress"; anything less starts a real staged rollout. No
      # version_code is passed: fastlane promotes whatever is active on the source track.
      # Every flavour is tried; a later step fails the job if any promotion failed.
      - name: Promote Internal Testing builds to Production
        id: promote
        shell: bash
        env:
          ROLLOUT_PCT: ${{ inputs.rollout_percentage }}
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }
          # The newest versionCode on a package's track, or 0 when it has none.
          newest_code() {
            fastlane run google_play_track_version_codes package_name:"$1" json_key:play-service-account.json track:"$2" 2>&1 \
              | sed -n 's/.*Result: \[\(.*\)\].*/\1/p' | tail -1 | tr ',' '\n' | tr -d ' ' | grep -E '^[0-9]+$' \
              | sort -n | tail -1 | grep . || echo 0
          }

          if [ "$ROLLOUT_PCT" -ge 100 ]; then
            STATUS=completed
            ROLLOUT_ARGS=()
          else
            STATUS=inProgress
            FRACTION=$(awk "BEGIN { printf \"%.2f\", $ROLLOUT_PCT / 100 }")
            ROLLOUT_ARGS=(rollout:"$FRACTION")
          fi

          SUMMARY=""
          PROMOTED_ANY=false
          FAILED=false
          PROMOTED_CODE=""
          PROMOTED_FLAVORS=""
          for FLAVOR in $APP_FLAVORS; do
            PACKAGE="$(var "$FLAVOR" APPLICATION_ID)"
            LABEL="$PACKAGE"
            [ "$FLAVOR" != "default" ] && LABEL="$FLAVOR ($PACKAGE)"
            INTERNAL=$(newest_code "$PACKAGE" internal)
            PRODUCTION=$(newest_code "$PACKAGE" production)
            echo "$LABEL: internal $INTERNAL, production $PRODUCTION"

            if [ "$INTERNAL" -eq 0 ]; then
              SUMMARY+="- ⏭️ $LABEL: nothing on Internal Testing"$'\n'
            elif [ "$INTERNAL" -le "$PRODUCTION" ]; then
              SUMMARY+="- ⏭️ $LABEL: already in Production (version code $PRODUCTION)"$'\n'
            elif fastlane run upload_to_play_store \
                package_name:"$PACKAGE" \
                json_key:play-service-account.json \
                track:internal \
                track_promote_to:production \
                track_promote_release_status:"$STATUS" \
                skip_upload_aab:true \
                skip_upload_apk:true \
                skip_upload_metadata:true \
                skip_upload_images:true \
                skip_upload_screenshots:true \
                "${ROLLOUT_ARGS[@]}"; then
              SUMMARY+="- ✅ $LABEL: version code $INTERNAL promoted to Production ($ROLLOUT_PCT% rollout)"$'\n'
              PROMOTED_ANY=true
              PROMOTED_CODE="$INTERNAL"
              PROMOTED_FLAVORS+="${PROMOTED_FLAVORS:+, }$FLAVOR"
            else
              SUMMARY+="- ❌ $LABEL: promotion failed - check the workflow run"$'\n'
              FAILED=true
            fi
          done

          printf '%s' "$SUMMARY"
          printf '%s' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<SUMMARY_EOF"
            printf '%s' "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "PROMOTED_ANY=$PROMOTED_ANY"
            echo "PROMOTE_FAILED=$FAILED"
            echo "PROMOTED_CODE=$PROMOTED_CODE"
            echo "PROMOTED_FLAVORS=$PROMOTED_FLAVORS"
          } >> "$GITHUB_ENV"

      - name: Remove Play service account key
        if: always()
        run: rm -f play-service-account.json

      # The release is live once any flavour reached Production.
      - name: Publish matching GitHub release
        if: env.PROMOTED_ANY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false

      # Adds the published release to the release notes document (see the header) and links the
      # GitHub release to its section, at the commit that added it (main gets the doc only with
      # the next release). A failure here is reported but doesn't fail the promotion, which has
      # already happened.
      - name: Add the release to the release notes document
        if: env.PROMOTED_ANY == 'true' && inputs.release_notes_doc != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DOC: ${{ inputs.release_notes_doc }}
          BRANCH: ${{ inputs.release_notes_branch }}
          APP_NAME: ${{ inputs.app_display_name }}
        run: |
          set -euo pipefail
          LINK_PREFIX="📝 Release notes:"
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          PREV_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" "$RELEASE_TAG^" 2>/dev/null || true)

          # The release's own notes, without a link line from an earlier run.
          gh release view "$RELEASE_TAG" --repo "$REPO" --json body --jq .body \
            | grep -v "^$LINK_PREFIX" > "$RUNNER_TEMP/notes.md" || true
          RELEASE_PR=$(gh api "repos/$REPO/commits/$TAG_SHA/pulls" --jq '[.[] | select(.base.ref == "main")][0].number // empty' || true)

          # PRs merged since the previous tag, except release PRs (into main) and back-merges.
          : > "$RUNNER_TEMP/prs.md"
          RANGE="$RELEASE_TAG"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..$RELEASE_TAG"
          for N in $(git log --merges --format=%s "$RANGE" | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p' | sort -rn | uniq); do
            PR=$(gh pr view "$N" --repo "$REPO" --json title,baseRefName --jq '[.baseRefName, .title] | @tsv' || true)
            BASE=${PR%%$'\t'*}
            TITLE=${PR#*$'\t'}
            [ -n "$PR" ] && [ "$BASE" != "main" ] && echo "- #$N $TITLE" >> "$RUNNER_TEMP/prs.md"
          done

          # Edit the doc on the branch in a separate worktree.
          WORKTREE="$RUNNER_TEMP/release-notes"
          git fetch -q origin "$BRANCH"
          git worktree add -q -B release-notes-update "$WORKTREE" "origin/$BRANCH"
          cd "$WORKTREE"
          mkdir -p "$(dirname "$DOC")"

          export RELEASE_PR PREV_TAG
          cat > "$RUNNER_TEMP/release_notes_doc.py" <<'PYEOF'
          import datetime, os, re, sys

          doc = sys.argv[1]
          env = os.environ
          tag, repo = env["RELEASE_TAG"], env["REPO"]
          # GitHub's heading anchor: lower case, punctuation other than - and _ removed, spaces to -.
          anchor = re.sub(r"[^a-z0-9 _-]", "", tag.lower()).replace(" ", "-")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          read = lambda name: open(os.path.join(env["RUNNER_TEMP"], name)).read().strip()
          notes, prs = read("notes.md"), read("prs.md")
          # Play-style "•" lines would run together as one markdown paragraph: make them list items.
          notes = re.sub(r"^\s*[•·]\s*", "- ", notes, flags=re.M)

          name = env.get("APP_NAME", "").strip()
          title = f"# {name} release notes" if name else "# Release notes"
          intro = ("Each release's notes, newest first. Added by the release workflow when a release is "
                   "published; the GitHub release for that tag links to its section.")
          table_head = "| Version | Date | Tag | Notes |\n|---|---|---|---|"

          top, rows, sections = f"{title}\n\n{intro}", [], ""
          if os.path.exists(doc):
              text = open(doc).read()
              if re.search(r"^## " + re.escape(tag) + r"\s*$", text, re.M):
                  print("exists")
                  sys.exit(0)
              table = re.search(r"^\| Version \|.*\n\|[-| ]+\|\n((?:\|.*\|\n?)*)", text, re.M)
              if table:
                  top = text[:table.start()].rstrip()
                  rows = [r for r in table.group(1).splitlines() if r.strip()]
              first = re.search(r"^## ", text, re.M)
              sections = text[first.start():].rstrip() if first else ""

          release_url = f"https://github.com/{repo}/releases/tag/{tag}"
          row = f"| {tag} | {date} | [{tag}]({release_url}) | [{tag}](#{anchor}) |"
          flavors = env.get("PROMOTED_FLAVORS", "")
          flavors = "" if flavors in ("", "default") else flavors.replace(", ", " and ")
          code = env.get("PROMOTED_CODE", "")
          released = " · ".join(x for x in [date, f"versionCode {code}" if code else "", flavors] if x)
          links = [f"[GitHub release]({release_url})"]
          if env.get("RELEASE_PR"):
              pr = env["RELEASE_PR"]
              links.append(f"[Release PR #{pr}](https://github.com/{repo}/pull/{pr})")
          if env.get("PREV_TAG"):
              prev = env["PREV_TAG"]
              links.append(f"[Changes since {prev}](https://github.com/{repo}/compare/{prev}...{tag})")

          section = (f"## {tag}\n\n- **Released:** {released}\n- **Links:** {' · '.join(links)}\n\n"
                     f"### What's new\n\n{notes or '-'}\n")
          if prs:
              section += f"\n### Pull requests\n\n{prs}\n"

          out = f"{top}\n\n{table_head}\n" + "\n".join([row] + rows) + f"\n\n{section}"
          if sections:
              out += f"\n{sections}\n"
          open(doc, "w").write(out)
          print(anchor)
          PYEOF
          RESULT=$(python3 "$RUNNER_TEMP/release_notes_doc.py" "$DOC")
          if [ "$RESULT" = "exists" ]; then
            echo "$RELEASE_TAG is already in $DOC; nothing to add."
            exit 0
          fi

          git add "$DOC"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Release notes for $RELEASE_TAG"
          # The branch may move on meanwhile: rebase and try again.
          for TRY in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && break
            [ "$TRY" = 3 ] && { echo "::error::Couldn't push the release notes to $BRANCH"; exit 1; }
            git fetch -q origin "$BRANCH" && git rebase -q "origin/$BRANCH"
          done

          LINK="https://github.com/$REPO/blob/$(git rev-parse HEAD)/$DOC#$RESULT"
          printf '%s\n\n%s %s\n' "$(cat "$RUNNER_TEMP/notes.md")" "$LINK_PREFIX" "$LINK" > "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/body.md"
          echo "Added $RELEASE_TAG to $DOC on $BRANCH: $LINK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if any flavour's promotion failed
        if: env.PROMOTE_FAILED == 'true'
        run: |
          echo "::error::At least one flavour failed to promote - see the step summary."
          exit 1

  # Only for the comment-triggered path - a workflow_dispatch run already shows its
  # result directly in the Actions UI, but a "promote-production" PR comment has no
  # other feedback channel back to whoever typed it. always() so this still posts on
  # a failed promotion, not just a successful one.
  notify_result:
    needs: [ check_command, promote ]
    if: always() && github.event_name == 'issue_comment' && needs.check_command.outputs.should_promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment promotion result on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.promote.outputs.summary }}
        run: |
          if [ "${{ needs.promote.result }}" = "success" ]; then
            HEADER="## 🚀 Promote to Production"
          else
            HEADER="## ❌ Promote to Production failed - check the workflow run"
          fi
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$(printf '%s\n\n%s' "$HEADER" "$SUMMARY")"
