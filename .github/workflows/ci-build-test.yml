# Reusable CI workflow shared across aaatechnology Android app repos: for each selected
# product flavour, builds the debug APK, runs unit tests + Jacoco coverage, and distributes
# the APK via Firebase App Distribution to that flavour's own Firebase app. Each app repo's own workflow just calls this one with its
# app-specific inputs/secrets - see AgeCalculator's .github/workflows/android-apk-generation.yml
# for the calling pattern.
#
# On a PR it keeps one comment up to date (found by a hidden marker): each flavour's
# version, coverage and Firebase upload, or, when the run fails, the failing flavour, its
# failing unit tests and Gradle's error, with links to the run and its test and coverage
# reports artifact (failures only, kept 3 days). A failure before the build (Gradle not
# starting) is reported too.
#
# Extracted after the same storage-quota bug (a GitHub Actions artifact upload with no
# consumer, blocking every PR check) was found independently copy-pasted across six
# app repos - fixing it once here means it can't drift out of sync per-repo again.
#
# Supports being invoked from an issue_comment event (a "build-it" comment on a PR),
# not just pull_request/workflow_dispatch - see the "Resolve PR context" step below.
# The calling repo's own workflow is what actually declares the issue_comment trigger
# and checks the comment body for the keyword before invoking this job at all; by the
# time this reusable workflow runs, it just needs to resolve the same PR head/base SHAs
# a pull_request event gets for free, since issue_comment only carries the issue/PR
# number, not its head/base refs directly.
#
# Flavours: `flavors` is "all" (every flavour the app has) or a comma/space-separated list.
# Everything per flavour - applicationId, Firebase app ID, task names, output paths - comes
# from the com.aaatech.build-tools plugin's printAppInfo task (>= 0.14.0), not from inputs,
# so it can't drift from the app's Gradle setup. An app without flavours has exactly one,
# named "default".
#
# UI tests (from 0.15.0, opt-in with run_ui_tests): after a successful build, each flavour's
# instrumented tests run on one Android emulator, and the comment adds their results and
# coverage (the plugin's uiTestJacocoReport). They only report by default;
# fail_on_ui_test_failure makes them fail the check.

name: Android Debug CI (reusable)

on:
  workflow_call:
    inputs:
      app_display_name:
        description: 'Display name used in Firebase release notes and PR comments (e.g. "Age Calculator")'
        required: true
        type: string
      firebase_testers_group:
        description: 'Firebase App Distribution tester group to distribute debug builds to'
        required: false
        type: string
        default: 'android-testers'
      flavors:
        description: 'Flavours to build: "all" (every flavour; "default" for an app without flavours) or a comma/space-separated list like "free,pro"'
        required: false
        type: string
        default: 'all'
      upload_to_firebase:
        description: 'If false, skip uploading the debug APKs to Firebase App Distribution'
        required: false
        type: boolean
        default: true
      java_version:
        description: 'JDK version to build with'
        required: false
        type: string
        default: '17'
      auto_merge_to_develop:
        description: >-
          If true, enable GitHub auto-merge on PRs targeting develop once this job
          succeeds. Auto-merge still waits for branch protection requirements (e.g.
          an approving review) on develop before actually merging - this only queues
          it, it does not bypass review. Has no effect on PRs targeting any other
          branch, or on non-pull_request triggers.
        required: false
        type: boolean
        default: false
      run_ui_tests:
        description: >-
          If true, also run each built flavour's instrumented (UI) tests on an Android
          emulator and report their results and coverage in the PR comment. Slow (an
          emulator boot plus the suite per flavour), so callers usually set it only for
          release PRs, e.g. `github.event.pull_request.base.ref == 'main'`. The app needs
          android.buildTypes.debug { enableAndroidTestCoverage = true } for the coverage.
        required: false
        type: boolean
        default: false
      ui_test_api_level:
        description: 'Android API level of the emulator the UI tests run on (a google_apis x86_64 image)'
        required: false
        type: string
        default: '36'
      fail_on_ui_test_failure:
        description: >-
          If true, failing UI tests (or an emulator that won't start) fail this check.
          False by default: the results are only reported, so a flaky emulator run
          doesn't block the PR while the suite settles in CI.
        required: false
        type: boolean
        default: false
    secrets:
      # Only a fallback for an app with one flavour and no google-services.json: each
      # flavour's Firebase app ID normally comes from google-services.json (printAppInfo).
      firebase_app_id:
        required: false
      credential_file_content:
        required: true
      gh_packages_read_token:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: enabling auto-merge below performs a merge against the
      # base branch, which needs write access to contents (in addition to the
      # pull-requests write already needed for the PR comment step).
      contents: write
      pull-requests: write
    # ./gradlew below needs this: app/build.gradle.kts applies the
    # com.aaatech.build-tools plugin from aaatechnology/build-tools's GitHub Packages
    # registry, which requires auth to resolve even though the repo is public.
    env:
      # Must match gh_packages_read_token's actual owning account (aaatechnology),
      # not github.actor (whoever triggered this run) - GitHub Packages validates
      # the pair together.
      GITHUB_ACTOR: aaatechnology
      GH_PACKAGES_READ_TOKEN: ${{ secrets.gh_packages_read_token }}
      # Per-flavour results (APK path, version, coverage, Firebase status), one folder each.
      FLAVOR_RESULTS: ${{ github.workspace }}/../flavor-results
      # Each flavour's unit-test and Jacoco reports, uploaded as the run's reports artifact.
      REPORTS: ${{ github.workspace }}/../reports

    steps:
      # Unifies pull_request and issue_comment ("build-it" PR-comment retrigger)
      # events behind one set of outputs, so every step below branches on
      # steps.pr_context.outputs.is_pr instead of re-deriving PR context per event
      # type. issue_comment doesn't carry pull_request.head/base directly - it only
      # has the issue/PR number - so it needs one API call to resolve the same
      # head/base SHAs a pull_request event gets for free.
      - name: Resolve PR context
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          # The PR's branch name is chosen by whoever opens the PR, so it goes through an
          # environment variable, never straight into the script (where a crafted name
          # could run as shell code).
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(echo "$PR_JSON" | jq -r '.base.sha')" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(echo "$PR_JSON" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          # On pull_request/issue_comment, check out the real PR head commit - not
          # the default ephemeral merge-preview commit (PR head merged with the base
          # branch's current state at the moment the workflow ran, an actual commit
          # but a throwaway one, never part of permanent history). Without this,
          # versionName (git describe, computed from whatever's actually checked
          # out) reflects that synthetic commit while the "Commit:" field elsewhere
          # in this workflow shows the real head SHA - two different hashes in the
          # same PR comment.
          ref: ${{ steps.pr_context.outputs.is_pr == 'true' && steps.pr_context.outputs.head_sha || github.ref }}
          # Full history so "git log" below can see real commits, not just the
          # single commit a shallow (depth-1) checkout leaves behind.
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Asks Gradle for each selected flavour's applicationId, Firebase app ID, task names
      # and output paths, as KEY=value lines (APP_FLAVORS, FREE_APPLICATION_ID, ...) added to
      # the environment. Fails here, before building, on an unknown flavour. Gradle's JVM
      # also prints WARNING lines, hence the filter.
      - name: Read the app's flavours from Gradle
        shell: bash
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: |
          # stderr is kept too: if this fails (Gradle can't even start, e.g. its download times
          # out), the PR comment shows why.
          ./gradlew -q printAppInfo "-PappFlavors=$FLAVORS" > "$RUNNER_TEMP/app-info.txt" \
            2> >(tee "$RUNNER_TEMP/app-info.err" >&2)
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/app-info.txt" | tee -a "$GITHUB_ENV"

      # Per flavour: unit tests + Jacoco coverage reports (the combined all-modules report,
      # each module's own, and the module list) and the debug APK, in one Gradle invocation
      # (the daemon carries over between flavours). Coverage reports are read straight after
      # each run, before the next flavour overwrites them. The coverage tasks come from
      # com.aaatech.build-tools and are zero-config no-ops for modules without tests.
      # A failing flavour doesn't stop the others: its status, failing tests and Gradle's
      # "What went wrong" are kept for the PR comment, every flavour's test and coverage
      # reports are copied to $REPORTS (uploaded below), and the step fails at the end.
      - name: Build, test and measure each flavour
        id: build
        shell: bash
        run: |
          # A flavour's variable, e.g. var free DEBUG_APK_DIR -> $FREE_DEBUG_APK_DIR (the
          # prefix rule matches printAppInfo's: freeProd -> FREE_PROD).
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          # Prints "covered total" (two numbers) from a JaCoCo XML report, or nothing at all
          # if the report doesn't exist (module had no tests/coverage data - not an error).
          parse_counts() {
            local report="$1"
            if [ -f "$report" ]; then
              local line_counter missed covered
              line_counter=$(grep -o '<counter type="LINE"[^/]*/>' "$report" | tail -1)
              missed=$(echo "$line_counter" | grep -oE 'missed="[0-9]+"' | grep -oE '[0-9]+')
              covered=$(echo "$line_counter" | grep -oE 'covered="[0-9]+"' | grep -oE '[0-9]+')
              echo "$covered $((missed + covered))"
            fi
          }

          format_pct() {
            local covered="$1" total="$2"
            if [ "$total" -gt 0 ]; then
              awk "BEGIN { printf \"%.1f\", ($covered / $total) * 100 }"
            else
              echo "0.0"
            fi
          }

          # Copies every module's unit-test and Jacoco reports for this flavour into $REPORTS.
          keep_reports() {
            local dest="$REPORTS/$1"
            mkdir -p "$dest"
            find . -path ./.git -prune -o -type d \( -path '*/build/reports/tests' -o -path '*/build/test-results' \
              -o -path '*/build/reports/jacoco' \) -print 2>/dev/null | while IFS= read -r dir; do
              mkdir -p "$dest/${dir#./}"
              cp -R "$dir/." "$dest/${dir#./}/"
            done
          }

          # Lists the failed unit tests from the JUnit XML results, at most 20, one per line.
          failed_tests() {
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for f in sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is not None:
                      cls = case.get("classname", "").rsplit(".", 1)[-1]
                      msg = (bad.get("message") or bad.text or "").strip().splitlines()
                      msg = msg[0][:200] if msg else ""
                      out.append(f"- `{cls} > {case.get('name')}`" + (f": {msg}" if msg else ""))
          print("\n".join(out[:20]) + (f"\n- …and {len(out) - 20} more" if len(out) > 20 else ""))
          PY
          }

          ANY_FAILED=false
          for FLAVOR in $APP_FLAVORS; do
            echo "::group::$FLAVOR"
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            mkdir -p "$OUT"

            if ./gradlew moduleJacocoReport combinedJacocoReport listCoverageModules "$(var "$FLAVOR" DEBUG_ASSEMBLE_TASK)" \
              "-PcoverageVariant=$(var "$FLAVOR" DEBUG_VARIANT)" 2>&1 | tee "$OUT/gradle.log"; then
              echo success > "$OUT/status"
            else
              echo failure > "$OUT/status"
              ANY_FAILED=true
              failed_tests > "$OUT/failed-tests"
              sed -n '/^\* What went wrong:/,/^\* Try:/p' "$OUT/gradle.log" | grep -v '^\* Try:' | head -15 > "$OUT/error"
              keep_reports "$FLAVOR"
              echo "::endgroup::"
              continue
            fi
            keep_reports "$FLAVOR"

            # Overall figure: the combined (all-modules) report on the app module.
            read -r OVERALL_COVERED OVERALL_TOTAL <<< "$(parse_counts "app/build/reports/jacoco/combinedJacocoReport/combinedJacocoReport.xml")"
            if [ -z "$OVERALL_TOTAL" ]; then
              echo "unavailable (report not found)" > "$OUT/coverage"
            else
              echo "$(format_pct "$OVERALL_COVERED" "$OVERALL_TOTAL")% lines covered (${OVERALL_COVERED}/${OVERALL_TOTAL})" > "$OUT/coverage"
            fi

            # Per-module breakdown, only with more than one module (listCoverageModules is
            # Gradle's live project model, not a guess at settings.gradle's syntax).
            MODULES=$(cat app/build/coverage-modules.txt 2>/dev/null || true)
            MODULE_COUNT=$(echo "$MODULES" | grep -c . || true)
            : > "$OUT/coverage-breakdown"
            if [ "$MODULE_COUNT" -gt 1 ]; then
              while IFS= read -r module; do
                [ -z "$module" ] && continue
                read -r MOD_COVERED MOD_TOTAL <<< "$(parse_counts "$module/build/reports/jacoco/moduleJacocoReport/moduleJacocoReport.xml")"
                if [ -z "$MOD_TOTAL" ]; then
                  MOD_RESULT="no tests found"
                else
                  MOD_RESULT="$(format_pct "$MOD_COVERED" "$MOD_TOTAL")% (${MOD_COVERED}/${MOD_TOTAL})"
                fi
                echo "  - ${module}: ${MOD_RESULT}" >> "$OUT/coverage-breakdown"
              done <<< "$MODULES"
            fi

            # The APK and the version AGP actually embedded in it (output-metadata.json is
            # written alongside the APK), not recomputed here.
            APK_DIR="$(var "$FLAVOR" DEBUG_APK_DIR)"
            find "$APK_DIR" -name "*.apk" | head -1 > "$OUT/apk"
            METADATA_FILE=$(find "$APK_DIR" -name "output-metadata.json" | head -1)
            if [ -n "$METADATA_FILE" ]; then
              jq -r '.elements[0].versionName' "$METADATA_FILE" > "$OUT/version_name"
              jq -r '.elements[0].versionCode' "$METADATA_FILE" > "$OUT/version_code"
            else
              echo unknown > "$OUT/version_name"
              echo unknown > "$OUT/version_code"
            fi
            echo "$FLAVOR: $(cat "$OUT/apk"), $(cat "$OUT/version_name") ($(cat "$OUT/version_code")), coverage $(cat "$OUT/coverage")"
            echo "::endgroup::"
          done
          [ "$ANY_FAILED" = false ]

      # UI tests (opt-in, run_ui_tests): one emulator for every flavour, after a successful
      # build. The emulator needs KVM, which standard ubuntu-latest runners have but don't
      # open to the runner user by default.
      - name: Enable KVM for the emulator
        if: inputs.run_ui_tests && steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action runs its `script` one line at a time with sh, so the per-flavour
      # loop lives in a bash file. For each flavour that built: its connected tests and the
      # uiTestJacocoReport (--continue, so coverage is still measured when a test fails), its
      # results, failing tests and coverage for the PR comment, and its reports in $REPORTS.
      - name: Write the UI test script
        if: inputs.run_ui_tests && steps.build.outcome == 'success'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ui-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -o pipefail

          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          parse_counts() {
            local report="$1"
            if [ -f "$report" ]; then
              local line_counter missed covered
              line_counter=$(grep -o '<counter type="LINE"[^/]*/>' "$report" | tail -1)
              missed=$(echo "$line_counter" | grep -oE 'missed="[0-9]+"' | grep -oE '[0-9]+')
              covered=$(echo "$line_counter" | grep -oE 'covered="[0-9]+"' | grep -oE '[0-9]+')
              echo "$covered $((missed + covered))"
            fi
          }

          format_pct() {
            local covered="$1" total="$2"
            if [ "$total" -gt 0 ]; then
              awk "BEGIN { printf \"%.1f\", ($covered / $total) * 100 }"
            else
              echo "0.0"
            fi
          }

          # "<passed>/<total> passed" into $2/ui-tests and the failing tests (at most 20) into
          # $2/ui-failed-tests, from the connected test XML of flavour $1 ("default": unflavoured).
          ui_results() {
            python3 - "$1" "$2" <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          flavor, out = sys.argv[1], sys.argv[2]
          total, failed = 0, []
          for f in sorted(glob.glob("**/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
              if flavor != "default" and f"/flavors/{flavor}/" not in f:
                  continue
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is not None:
                      cls = case.get("classname", "").rsplit(".", 1)[-1]
                      msg = (bad.get("message") or bad.text or "").strip().splitlines()
                      msg = msg[0][:200] if msg else ""
                      failed.append(f"- `{cls} > {case.get('name')}`" + (f": {msg}" if msg else ""))
          with open(os.path.join(out, "ui-tests"), "w") as fh:
              fh.write(f"{total - len(failed)}/{total} passed\n" if total else "no results found\n")
          with open(os.path.join(out, "ui-failed-tests"), "w") as fh:
              fh.write("\n".join(failed[:20]) + (f"\n- …and {len(failed) - 20} more" if len(failed) > 20 else ""))
          PY
          }

          # Copies every module's connected test results and UI coverage report into $REPORTS.
          keep_ui_reports() {
            local dest="$REPORTS/$1"
            mkdir -p "$dest"
            find . -path ./.git -prune -o -type d \( -path '*/build/reports/androidTests' \
              -o -path '*/build/outputs/androidTest-results' -o -path '*/build/reports/jacoco/uiTestJacocoReport' \) \
              -print 2>/dev/null | while IFS= read -r dir; do
              mkdir -p "$dest/${dir#./}"
              cp -R "$dir/." "$dest/${dir#./}/"
            done
          }

          ANY_FAILED=false
          for FLAVOR in $APP_FLAVORS; do
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            [ "$(cat "$OUT/status" 2>/dev/null)" = success ] || continue
            echo "::group::UI tests: $FLAVOR"

            if ./gradlew --continue "$(var "$FLAVOR" DEBUG_UI_TEST_TASK)" uiTestJacocoReport \
              "-PcoverageVariant=$(var "$FLAVOR" DEBUG_VARIANT)" 2>&1 | tee "$OUT/ui-gradle.log"; then
              echo success > "$OUT/ui-status"
            else
              echo failure > "$OUT/ui-status"
              ANY_FAILED=true
              sed -n '/^\* What went wrong:/,/^\* Try:/p' "$OUT/ui-gradle.log" | grep -v '^\* Try:' | head -15 > "$OUT/ui-error"
            fi
            ui_results "$FLAVOR" "$OUT"
            keep_ui_reports "$FLAVOR"

            read -r UI_COVERED UI_TOTAL <<< "$(parse_counts "app/build/reports/jacoco/uiTestJacocoReport/uiTestJacocoReport.xml")"
            if [ -z "${UI_TOTAL:-}" ]; then
              echo "unavailable (report not found - is enableAndroidTestCoverage on?)" > "$OUT/ui-coverage"
            else
              echo "$(format_pct "$UI_COVERED" "$UI_TOTAL")% lines covered (${UI_COVERED}/${UI_TOTAL})" > "$OUT/ui-coverage"
            fi
            echo "$FLAVOR UI tests: $(cat "$OUT/ui-tests"), coverage $(cat "$OUT/ui-coverage")"
            echo "::endgroup::"
          done
          [ "$ANY_FAILED" = false ]
          SCRIPT

      # Fails (and so fails the check) only with fail_on_ui_test_failure; otherwise the results
      # are reported and the step's failure stays out of the check.
      - name: Run UI tests on an emulator
        id: ui_tests
        if: inputs.run_ui_tests && steps.build.outcome == 'success'
        continue-on-error: ${{ !inputs.fail_on_ui_test_failure }}
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.ui_test_api_level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/ui-tests.sh"

      # Each flavour's test and coverage reports, so a failing test can be read in its HTML
      # report; the PR comment links to it. Only when the build or the UI tests failed, reports
      # only (no APKs) and kept 3 days - artifacts count toward the account's storage quota,
      # which an upload nobody read once filled (see top). build-tools' Artifact Housekeeping
      # also deletes anything older than 3 days in every repo.
      - name: Upload test and coverage reports
        id: reports
        if: failure() || steps.ui_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORTS }}
          retention-days: 3
          if-no-files-found: ignore

      # Resolve the actual head commit (github.sha is the synthetic merge commit on
      # pull_request events, not the real PR head) and its short hash + subject line.
      - name: Get commit message
        if: always()
        run: |
          if [ "${{ steps.pr_context.outputs.is_pr }}" = "true" ]; then
            COMMIT_SHA="${{ steps.pr_context.outputs.head_sha }}"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          COMMIT_SHA_SHORT=$(git rev-parse --short "$COMMIT_SHA" 2>/dev/null || echo "${COMMIT_SHA:0:7}")
          COMMIT_MESSAGE_SUBJECT=$(git log -1 --pretty=%s "$COMMIT_SHA" 2>/dev/null || echo "")
          if [ -z "$COMMIT_MESSAGE_SUBJECT" ]; then
            COMMIT_MESSAGE_SUBJECT="(commit message unavailable)"
          fi
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_SHA_SHORT=$COMMIT_SHA_SHORT" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE_SUBJECT=$COMMIT_MESSAGE_SUBJECT" >> $GITHUB_ENV

      # Recent Changes: for a PR, only the commits this PR actually introduces
      # (base..head) - not the target branch's whole history. For a direct push
      # (e.g. after a merge), fall back to the last 10 non-merge commits from HEAD.
      - name: Generate release notes from commits
        if: always()
        run: |
          if [ "${{ steps.pr_context.outputs.is_pr }}" = "true" ]; then
            COMMIT_MESSAGES=$(git log ${{ steps.pr_context.outputs.base_sha }}..${{ env.COMMIT_SHA }} --no-merges --pretty=format:"• %s" 2>/dev/null || echo "")
          else
            COMMIT_MESSAGES=$(git log -10 --no-merges --pretty=format:"• %s" 2>/dev/null || echo "")
          fi

          if [ -z "$COMMIT_MESSAGES" ]; then
            COMMIT_MESSAGES="• Latest development build"
          fi

          echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Get current timestamp for release notes (IST, not the runner's default UTC)
      - name: Get current timestamp
        if: always()
        run: |
          CURRENT_DATE=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV

      # One upload per flavour, each to its own Firebase app (from google-services.json via
      # printAppInfo). The firebase_app_id secret is only a fallback for an app with a single
      # flavour and no google-services.json - with several flavours it would send every APK
      # to the same app. Every flavour is tried; the step fails afterwards if any upload did.
      - name: Upload debug APKs to Firebase App Distribution
        id: firebase_distribution
        if: inputs.upload_to_firebase
        shell: bash
        env:
          CREDENTIALS: ${{ secrets.credential_file_content }}
          FALLBACK_APP_ID: ${{ secrets.firebase_app_id }}
          GROUP: ${{ inputs.firebase_testers_group }}
          BRANCH: ${{ steps.pr_context.outputs.head_ref || github.ref_name }}
          DISPLAY_NAME: ${{ inputs.app_display_name }}
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          npm install -g firebase-tools >/dev/null 2>&1
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$CREDENTIALS" > "$GOOGLE_APPLICATION_CREDENTIALS"

          FLAVOR_COUNT=$(wc -w <<< "$APP_FLAVORS")
          FAILED=false
          for FLAVOR in $APP_FLAVORS; do
            OUT="$FLAVOR_RESULTS/$FLAVOR"
            APP_ID="$(var "$FLAVOR" FIREBASE_APP_ID)"
            if [ -z "$APP_ID" ] && [ "$FLAVOR_COUNT" -eq 1 ]; then
              APP_ID="$FALLBACK_APP_ID"
            fi
            if [ -z "$APP_ID" ]; then
              echo "⚠️ not uploaded: no Firebase app for $(var "$FLAVOR" APPLICATION_ID) in google-services.json" > "$OUT/firebase"
              FAILED=true
              continue
            fi

            LABEL="$DISPLAY_NAME"
            [ "$FLAVOR" != "default" ] && LABEL="$DISPLAY_NAME ($FLAVOR)"
            cat > "$OUT/notes.txt" <<NOTES
          🚀 $LABEL $(cat "$OUT/version_name") (Debug)

          📱 Recent Changes:
          $COMMIT_MESSAGES

          📋 Build Details:
          - Version: $(cat "$OUT/version_name"), Version Code: $(cat "$OUT/version_code")
          - Branch: $BRANCH
          - Commit: $COMMIT_SHA_SHORT - $COMMIT_MESSAGE_SUBJECT
          - Workflow run: ${{ github.run_number }}
          - Date: $CURRENT_DATE
          - Unit test coverage: $(cat "$OUT/coverage")
          $(cat "$OUT/coverage-breakdown")
          NOTES

            if firebase appdistribution:distribute "$(cat "$OUT/apk")" --app "$APP_ID" \
                --groups "$GROUP" --release-notes-file "$OUT/notes.txt"; then
              echo "✅ uploaded" > "$OUT/firebase"
            else
              echo "❌ upload failed - check the workflow run" > "$OUT/firebase"
              FAILED=true
            fi
          done
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          [ "$FAILED" = false ]

      # One comment per PR, updated by every run (found by its hidden marker): a section per
      # flavour with its version, coverage and Firebase upload, or, when the run failed, what
      # failed - the flavour, its failing unit tests and Gradle's error - with links to the
      # run and its test and coverage reports. Also posts when the build never started (e.g.
      # Gradle couldn't be downloaded), with the error from reading the flavours.
      - name: Post links to PR
        if: always() && steps.pr_context.outputs.is_pr == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BRANCH: ${{ steps.pr_context.outputs.head_ref || github.ref_name }}
          DISPLAY_NAME: ${{ inputs.app_display_name }}
          UPLOAD: ${{ inputs.upload_to_firebase }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_UI_TESTS: ${{ inputs.run_ui_tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          REPORTS_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          var() {
            local key
            key=$(printf '%s' "$1" | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/[^A-Za-z0-9]/_/g' | tr '[:lower:]' '[:upper:]')
            local name="${key}_$2"
            printf '%s' "${!name}"
          }

          MARKER="<!-- aaatech-ci-build -->"
          REPORTS_LINE=""
          [ -n "$REPORTS_URL" ] && REPORTS_LINE=" · [Test and coverage reports]($REPORTS_URL)"

          BODY="$RUNNER_TEMP/pr-comment.md"
          {
            echo "$MARKER"
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "## 🚀 $DISPLAY_NAME Debug Build Ready"
            else
              echo "## ❌ $DISPLAY_NAME CI failed"
            fi
            echo
            echo "🔗 [Workflow run #${{ github.run_number }}]($RUN_URL)$REPORTS_LINE"
            echo
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$UPLOAD" = "true" ]; then
              echo "🔥 **Firebase Distribution:** [Test on Firebase](https://appdistribution.firebase.google.com)"
              echo
            fi

            if [ -z "$APP_FLAVORS" ]; then
              # Nothing was built: the run failed before the build (reading the flavours).
              echo "**The build didn't start.** Reading the app's flavours from Gradle failed:"
              echo
              echo '```'
              grep -vE '^\s*at |^\s*\.\.\. [0-9]+ more' "$RUNNER_TEMP/app-info.err" 2>/dev/null | grep . | tail -8 \
                || echo "(no error output - see the workflow run)"
              echo '```'
              echo
            fi

            for FLAVOR in $APP_FLAVORS; do
              OUT="$FLAVOR_RESULTS/$FLAVOR"
              STATUS=$(cat "$OUT/status" 2>/dev/null || echo "not built")
              ICON="📱"
              [ "$STATUS" != "success" ] && ICON="❌"
              if [ "$FLAVOR" = "default" ]; then
                echo "### $ICON $(var "$FLAVOR" APPLICATION_ID)"
              else
                echo "### $ICON $FLAVOR · $(var "$FLAVOR" APPLICATION_ID)"
              fi
              if [ "$STATUS" = "success" ]; then
                echo "- **Version:** $(cat "$OUT/version_name"), Version Code: $(cat "$OUT/version_code")"
                echo "- **Unit test coverage:** $(cat "$OUT/coverage")"
                cat "$OUT/coverage-breakdown"
                if [ -f "$OUT/ui-status" ]; then
                  UI_ICON=""
                  [ "$(cat "$OUT/ui-status")" != "success" ] && UI_ICON="❌ "
                  echo "- **UI tests:** ${UI_ICON}$(cat "$OUT/ui-tests" 2>/dev/null || echo 'no results found')"
                  echo "- **UI test coverage:** $(cat "$OUT/ui-coverage" 2>/dev/null || echo 'unavailable')"
                elif [ "$RUN_UI_TESTS" = "true" ]; then
                  echo "- **UI tests:** ❌ didn't run (the emulator didn't start - check the workflow run)"
                fi
                if [ "$UPLOAD" = "true" ]; then
                  echo "- **Firebase:** $(cat "$OUT/firebase" 2>/dev/null || echo '❌ not uploaded - check the workflow run')"
                fi
                if [ -s "$OUT/ui-failed-tests" ] && grep -q . "$OUT/ui-failed-tests"; then
                  echo
                  echo "**Failing UI tests:**"
                  cat "$OUT/ui-failed-tests"
                elif [ -s "$OUT/ui-error" ]; then
                  echo
                  echo "**UI tests (Gradle):**"
                  echo '```'
                  cat "$OUT/ui-error"
                  echo '```'
                fi
              elif [ "$STATUS" = "failure" ]; then
                if [ -s "$OUT/failed-tests" ] && grep -q . "$OUT/failed-tests"; then
                  echo "**Failing unit tests:**"
                  cat "$OUT/failed-tests"
                  echo
                fi
                if [ -s "$OUT/error" ]; then
                  echo "**Gradle:**"
                  echo '```'
                  cat "$OUT/error"
                  echo '```'
                fi
              else
                echo "- Not built (the run stopped before this flavour)"
              fi
              echo
            done

            echo "📋 **Build Information:**"
            echo "- **Branch:** $BRANCH"
            echo "- **Commit:** \`$COMMIT_SHA_SHORT\` - $COMMIT_MESSAGE_SUBJECT"
            echo "- **Workflow run:** [#${{ github.run_number }}]($RUN_URL)"
            echo "- **Date:** $CURRENT_DATE"
            echo
            echo "📝 **Recent Changes:**"
            echo "$COMMIT_MESSAGES"
            echo
            echo "---"
            echo "*Updated by GitHub Actions on every run*"
          } > "$BODY"

          # Update this PR's CI comment if there is one, otherwise post it.
          COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F "body=@$BODY" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$BODY"
          fi

      # Queues the merge - it does not bypass develop's branch protection. GitHub
      # only actually merges once every required check has passed AND every
      # required review/approval is satisfied, so this is safe to enable even
      # though it runs as soon as THIS job succeeds, before a human necessarily
      # has reviewed the PR yet.
      - name: Enable auto-merge for develop PRs
        if: >
          inputs.auto_merge_to_develop &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --auto --merge --delete-branch
